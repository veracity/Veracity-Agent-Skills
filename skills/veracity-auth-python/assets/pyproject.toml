[project]
name = "veracity-auth-python"
version = "0.1.0"
description = "Reference Veracity Identity integration for Python (FastAPI / Flask / Django) — OIDC BFF + JWT Bearer"
requires-python = ">=3.10"
# Framework-agnostic core dependencies (used by every adapter).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "msal>=1.28",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# Pick the extra that matches the framework you are integrating into. FastAPI is the
# default for new scaffolds; Flask/Django extras are for existing projects.
fastapi = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
flask = [
    "flask>=3.0",
]
django = [
    "django>=4.2",
    "djangorestframework>=3.15",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-django>=4.8",
    "ruff>=0.5",
    "mypy>=1.10",
    # frameworks needed to run the full reference test suite in one venv
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "flask>=3.0",
    "django>=4.2",
    "djangorestframework>=3.15",
]

[project.scripts]
# FastAPI HTTPS-first local dev launcher (see references/frameworks/fastapi.md).
veracity-dev = "app.dev_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.django_settings"

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Shared core + one package per framework. A real integration copies veracity_core plus
# the single adapter package for its framework.
packages = ["veracity_core", "app", "veracity_flask", "veracity_django"]
